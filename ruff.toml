# Linter for app/, tests/ and tools/ (runs in CI, locally: python -m ruff check)
line-length = 120
target-version = "py312"

[lint]
# Default rules (syntax, unused names) plus common sources of bugs
select = ["E", "F", "W", "B", "UP"]
ignore = [
    "E501",   # long lines: 120 as a guideline, template texts may be longer
    "B008",   # FastAPI: Form(...) as a default value is intended there
]

[lint.per-file-ignores]
"tests/*" = ["F811"]  # fixtures as parameters of the same name
