name: Image scan

# Weekly Trivy scan of the published image (tag "latest"). CI only scans an image while it is
# built, so a vulnerability found later in a released image would go unnoticed until the next
# pull request. A critical finding with a fix fails the run, which sends a notification.
# Critical and high findings also show up under Security -> Code scanning and close there
# by themselves once a new release fixes them.
# A pull request that changes this file runs the scan once as a test.

on:
  schedule:
    - cron: "23 5 * * 2" # Tuesday, after Dependabot's Monday run
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/image-scan.yml

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull the published image
        id: image
        run: |
          ref="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker pull "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      # Overview of critical and high findings that have a fix …
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "0"
      # Critical and high findings for Security -> Code scanning (not for test runs on pull
      # requests: their token may not write security events)
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: github.event_name != 'pull_request'
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          limit-severities-for-sarif: true
          exit-code: "0"
          skip-setup-trivy: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: github.event_name != 'pull_request'
        with:
          sarif_file: trivy.sarif
          category: image-scan
      # … only critical ones fail the run
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          skip-setup-trivy: true
