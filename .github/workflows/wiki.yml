name: Wiki

# Mirrors docs/ to the GitHub wiki: on every release and on demand (Actions → Wiki → Run).
# The source stays docs/ in the repo; edits made directly in the wiki are overwritten on the next run.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wiki:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # the wiki is a separate Git repo, writing to it needs this permission
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Wiki holen, Seiten erzeugen, zurückschreiben
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki
          python tools/wiki_sync.py docs wiki --ref "$REF" --repo "${{ github.repository }}"
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Wiki unverändert"; exit 0; fi
          git commit -m "Doku aus docs/ gespiegelt ($REF)"
          git push
