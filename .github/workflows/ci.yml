name: CI

# Pull requests and version tags run everything: linter (Ruff), Python tests, browser test
# (Playwright), image build for all platforms and a Trivy scan for known vulnerabilities.
# A push to main is almost always the squash of a PR that was just checked: only the linter
# and Python tests run there as a safety net, browser test and image build would be redundant.
# For pull requests the image is only test-built (not uploaded) to save storage and
# bandwidth and so a failure on one platform shows up before the release.
# It is only uploaded for a version tag (v1.2.3); afterwards the last
# five releases are kept (KEEP_VERSIONS), older ones are deleted.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  PLATFORMS: linux/amd64,linux/arm64   # PC/server, Raspberry Pi 4/5 and NAS
  # Package versions kept by the cleanup: per release 1 index + 1 image per platform
  # (2 platforms = 3 versions), so 5 releases = 15. Otherwise the platform images of
  # older releases would be deleted and those versions could no longer be installed.
  KEEP_VERSIONS: 15

jobs:
  changes:
    # Only docs changed (Markdown, docs/, licence, issue templates)? Then tests, browser test and
    # image are skipped; GitHub counts skipped required checks as passed. Tags always run everything.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if [ "$GITHUB_REF_TYPE" != tag ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE" HEAD | grep -qvE '\.md$|^docs/|^LICENSE$|^\.github/ISSUE_TEMPLATE/' || code=false
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04  # pinned so a change of ubuntu-latest does not change anything unexpectedly
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check
      - run: python -m pytest -q

  browser:
    needs: changes
    # Pages and 3D preview in real Chromium (software WebGL), without JavaScript errors
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'push' || github.ref_type == 'tag')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-browser.txt
      - run: pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_browser.py

  image:
    needs: [changes, test, browser]
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'push' || github.ref_type == 'tag')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: contains(env.PLATFORMS, 'arm')
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: release
        run: echo "push=${{ startsWith(github.ref, 'refs/tags/v') }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.release.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ steps.release.outputs.push }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ steps.release.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
          provenance: false   # no extra manifests, saves storage
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Security scan: load the amd64 image from the cache (the arm64 packages are the same)
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: plateshelf:scan
          provenance: false
          sbom: false
          cache-from: type=gha
      # Overview of critical and high vulnerabilities that have a fix …
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: plateshelf:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "0"
      # … but only critical ones fail the build; "high" in the base image should not block a release
      # until Debian has caught up (Dependabot then proposes the new base image)
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: plateshelf:scan
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          skip-setup-trivy: true

  release:
    # Creates the GitHub release from the matching CHANGELOG section
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '
            /^## / { if (found) exit; if ($0 == "## " v) { found=1; next } }
            found { print }' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" --title "PlateShelf ${GITHUB_REF_NAME#v}" --notes "${notes:-See CHANGELOG.md}"

  dependabot-merge:
    # Merges Dependabot proposals for patch and minor updates automatically once all
    # checks above are green. Major updates stay open and are reviewed by hand.
    needs: [test, browser, image]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Patch- und Minor-Updates übernehmen
        # Docker base images: only digest rebuilds and patch updates of the same version.
        # A new minor or major version (e.g. Python 3.14 -> 3.15) stays open until the
        # tests cover it.
        if: >-
          (steps.meta.outputs.package-ecosystem != 'docker'
            && (steps.meta.outputs.update-type == 'version-update:semver-patch'
              || steps.meta.outputs.update-type == 'version-update:semver-minor'))
          || (steps.meta.outputs.package-ecosystem == 'docker'
            && steps.meta.outputs.update-type != 'version-update:semver-minor'
            && steps.meta.outputs.update-type != 'version-update:semver-major')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash "$PR_URL"

  cleanup:
    # After a release, remove older image versions
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: ${{ env.KEEP_VERSIONS }}
