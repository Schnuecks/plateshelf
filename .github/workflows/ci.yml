name: CI

# Pull Requests und Versions-Tags durchlaufen alles: Linter (Ruff), Python-Tests, Browsertest
# (Playwright), Image-Bau für alle Plattformen und Trivy-Scan auf bekannte Sicherheitslücken.
# Ein Push auf main ist fast immer der Squash eines eben geprüften PRs: dort laufen nur Linter
# und Python-Tests als Sicherheitsnetz, Browsertest und Image-Bau wären doppelt.
# Bei Pull Requests wird das Image nur probeweise gebaut (nicht hochgeladen), damit Speicher
# und Datenvolumen geschont werden und ein Fehler auf einer Plattform vor dem Release auffällt.
# Hochgeladen wird es nur bei einem Versions-Tag (v1.2.3); danach bleiben die
# letzten fünf Releases erhalten (KEEP_VERSIONS), ältere werden gelöscht.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  PLATFORMS: linux/amd64,linux/arm64   # PC/Server, Raspberry Pi 4/5 und NAS
  # Paketversionen, die beim Aufräumen bleiben: pro Release 1 Index + 1 Image je Plattform
  # (2 Plattformen = 3 Versionen), also 5 Releases = 15. Sonst würden die Plattform-Images
  # älterer Releases gelöscht und diese Versionen ließen sich nicht mehr installieren.
  KEEP_VERSIONS: 15

jobs:
  test:
    runs-on: ubuntu-24.04  # fest, damit ein Wechsel von ubuntu-latest nichts unerwartet ändert
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check
      - run: python -m pytest -q

  browser:
    # Seiten und 3D-Vorschau in echtem Chromium (Software-WebGL), ohne JavaScript-Fehler
    if: github.event_name != 'push' || github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-browser.txt
      - run: pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_browser.py

  image:
    needs: [test, browser]
    if: github.event_name != 'push' || github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        if: contains(env.PLATFORMS, 'arm')
      - uses: docker/setup-buildx-action@v4
      - id: release
        run: echo "push=${{ startsWith(github.ref, 'refs/tags/v') }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        if: steps.release.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.release.outputs.push }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ steps.release.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
          provenance: false   # keine zusätzlichen Manifeste, spart Speicher
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Sicherheitsscan: das amd64-Image aus dem Cache laden (die arm64-Pakete sind dieselben)
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: plateshelf:scan
          provenance: false
          sbom: false
          cache-from: type=gha
      # Übersicht über kritische und hohe Lücken, für die es eine Korrektur gibt …
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: plateshelf:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "0"
      # … abgebrochen wird nur bei kritischen; „hoch“ im Basis-Image soll kein Release blockieren,
      # bis Debian nachgezogen hat (Dependabot schlägt das neue Basis-Image dann vor)
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: plateshelf:scan
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          skip-setup-trivy: true

  dependabot-merge:
    # Übernimmt Dependabot-Vorschläge für Patch- und Minor-Updates selbst, sobald alle
    # Prüfungen oben grün sind. Major-Updates bleiben offen und werden von Hand geprüft.
    needs: [test, browser, image]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - name: Patch- und Minor-Updates übernehmen
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash "$PR_URL"

  cleanup:
    # Nach einem Release ältere Image-Versionen entfernen
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: ${{ env.KEEP_VERSIONS }}
