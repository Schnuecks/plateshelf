name: CI

# Tests bei jedem Push und Pull Request: Python-Tests und ein Browsertest (Playwright).
# Das Docker-Image wird bei Pull Requests und Pushes auf main für alle Plattformen nur
# probeweise gebaut (nicht hochgeladen), damit Speicher und Datenvolumen des kostenlosen
# Plans geschont werden und ein Fehler auf einer Plattform vor dem Release auffällt.
# Hochgeladen wird es nur bei einem Versions-Tag (v1.2.3); danach bleiben die
# letzten fünf Releases erhalten (KEEP_VERSIONS), ältere werden gelöscht.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  PLATFORMS: linux/amd64,linux/arm64   # PC/Server, Raspberry Pi 4/5 und NAS
  # Paketversionen, die beim Aufräumen bleiben: pro Release 1 Index + 1 Image je Plattform
  # (2 Plattformen = 3 Versionen), also 5 Releases = 15. Sonst würden die Plattform-Images
  # älterer Releases gelöscht und diese Versionen ließen sich nicht mehr installieren.
  KEEP_VERSIONS: 15

jobs:
  test:
    runs-on: ubuntu-24.04  # fest, damit ein Wechsel von ubuntu-latest nichts unerwartet ändert
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  browser:
    # Seiten und 3D-Vorschau in echtem Chromium (Software-WebGL), ohne JavaScript-Fehler
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-browser.txt
      - run: pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_browser.py

  image:
    needs: [test, browser]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        if: contains(env.PLATFORMS, 'arm')
      - uses: docker/setup-buildx-action@v4
      - id: release
        run: echo "push=${{ startsWith(github.ref, 'refs/tags/v') }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        if: steps.release.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.release.outputs.push }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ steps.release.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
          provenance: false   # keine zusätzlichen Manifeste, spart Speicher
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup:
    # Nach einem Release ältere Image-Versionen entfernen
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: ${{ env.KEEP_VERSIONS }}
