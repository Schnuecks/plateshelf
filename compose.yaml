services:
  druckarchiv:
    image: ${DRUCKARCHIV_IMAGE:-ghcr.io/schnuecks/druckarchiv:latest}
    container_name: druckarchiv
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - path: .env       # u. a. für PRINTER_1_NAME, PRINTER_1_IP … (Direktimport)
        required: false
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - SCAN_INTERVAL=${SCAN_INTERVAL:-120}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-1024}
      - PREVIEW_PREBUILD=${PREVIEW_PREBUILD:-true}
      - TRASH_DAYS=${TRASH_DAYS:-30}
      - PRINTER_SYNC_INTERVAL=${PRINTER_SYNC_INTERVAL:-600}
      - PRINTER_IMPORT_DIR=${PRINTER_IMPORT_DIR:-Vom Drucker}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ${LIBRARY:-./library}:/library    # .gcode.3mf-Sammlung (für Upload und Löschen beschreibbar)
      - ${DATA:-./data}:/data             # Datenbank, Vorschaubilder, 3D-Vorschauen
