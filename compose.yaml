services:
  plateshelf:
    image: ${PLATESHELF_IMAGE:-ghcr.io/schnuecks/plateshelf:latest}
    container_name: plateshelf
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - path: .env       # e.g. PRINTER_1_… (direct import), DEFAULT_LANGUAGE, AUTH_USER
        required: false
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - SCAN_INTERVAL=${SCAN_INTERVAL:-120}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-1024}
      - PREVIEW_PREBUILD=${PREVIEW_PREBUILD:-true}
      - TRASH_DAYS=${TRASH_DAYS:-30}
      - PRINTER_SYNC_INTERVAL=${PRINTER_SYNC_INTERVAL:-600}
      - PRINTER_IMPORT_DIR=${PRINTER_IMPORT_DIR:-}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ${LIBRARY:-./library}:/library    # your .gcode.3mf files (writable for upload and delete)
      - ${DATA:-./data}:/data             # database, preview images, 3D previews
